<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | Ruach Digital</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    body {
      background: #ffffff;
      color: #111;
      font-family: 'Segoe UI', sans-serif;
      margin: 0; padding: 0;
    }
    .navbar-brand img {
      height: 60px; width: 60px; object-fit: cover;
      border-radius: 50%; margin-right: 10px;
    }
    .section {
      padding: 60px 20px; text-align: center;
    }
    .form-section {
      background-color: #f2f2f2; padding: 60px 20px;
    }
    .form-control, .form-select, textarea {
      border-radius: 8px;
    }
    .btn-primary {
      background-color: #d4af37; color: black;
      font-weight: bold; border: none;
      padding: 10px 24px; border-radius: 6px;
      text-decoration: none;
    }
    .btn-success {
      background-color: #25d366; border: none;
      color: white; padding: 10px 24px;
      border-radius: 6px; font-weight: bold;
    }
    .btn-success:hover {
      background-color: #1ebe5b;
    }
    .social-icons a {
      color: #111; font-size: 2rem;
      margin: 0 15px; transition: transform 0.3s;
    }
    .social-icons a:hover {
      transform: scale(1.2);
    }
    footer.footer {
      background: #111; padding: 2rem 0; color: white;
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/images/logo.jpg" alt="Ruach Logo" />
        Ruach Digital
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
          <li class="nav-item">
            <a class="nav-link btn-primary ms-lg-3" href="#contactForm">Get in Touch</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTACT INTRO -->
  <section class="section">
    <h2>Get in Touch</h2>
    <p class="lead">
      Have a question, project idea, or just want to say hello?  
      Fill out the form below or choose your preferred way to reach us.
    </p>
  </section>

  <!-- CONTACT FORM -->
  <section class="form-section" id="contactForm">
    <div class="container">
      <form id="contactForm">
        <div class="row g-3 justify-content-center">
          <div class="col-md-5">
            <input type="text" id="name" class="form-control" placeholder="Your Full Name" required />
          </div>
          <div class="col-md-5">
            <input type="email" id="email" class="form-control" placeholder="Your Email Address" required />
          </div>
          <div class="col-md-10">
            <select id="subject" class="form-select" required>
              <option value="">Select Subject</option>
              <option>General Inquiry</option>
              <option>Quote Request</option>
              <option>Support</option>
            </select>
          </div>
          <div class="col-md-10">
            <textarea id="message" class="form-control" rows="5" placeholder="Your Message" required></textarea>
          </div>
          <div class="col-md-10 d-flex justify-content-center gap-3">
            <button type="button" class="btn btn-primary" onclick="sendEmail()">Send via Email</button>
            <button type="button" class="btn btn-success" onclick="sendWhatsApp()">Send via WhatsApp</button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <!-- SOCIAL FOLLOW-UP -->
  <section class="section bg-light text-dark">
    <h2 class="mb-4">Follow Our Work</h2>
    <div class="social-icons d-flex justify-content-center flex-wrap">
      <a href="https://www.linkedin.com/in/caleb-zondo-65480a229" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://github.com/ZondoJnr" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://www.tiktok.com/@caleb_zondo" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="https://www.facebook.com/share/19eyybCtSp/" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://www.instagram.com/caleb_zondo" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com/@mvuselelo_zondo" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://wa.me/27799138027" target="_blank"><i class="fab fa-whatsapp"></i></a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer text-center">
    <p class="mt-3 mb-0">&copy; 2025 Ruach Digital. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Contact Form JS -->
  <script>
    function getValues() {
      return {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value.trim()
      };
    }

    function sendEmail() {
      const {name, email, subject, message} = getValues();
      const body = encodeURIComponent(
        `Name: ${name}\nEmail: ${email}\nSubject: ${subject}\n\nMessage:\n${message}`
      );
      window.location.href = `mailto:calebzondo8@gmail.com?subject=${encodeURIComponent(subject)}&body=${body}`;
    }

    function sendWhatsApp() {
      const {name, email, subject, message} = getValues();
      const text = encodeURIComponent(
        `*New Message from Ruach Digital Website*\nName: ${name}\nEmail: ${email}\nSubject: ${subject}\n\n${message}`
      );
      window.open(`https://wa.me/27799138027?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
